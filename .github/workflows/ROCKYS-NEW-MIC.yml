name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio library for speaker module
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: pc-server
        run: npm install

      - name: Check server file loads
        working-directory: pc-server
        run: node --check server.js
